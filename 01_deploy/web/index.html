<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nimbus Study Assistant</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f4f6fb; color: #172033; }
    main { width: min(760px, calc(100% - 32px)); margin: 48px auto; }
    h1 { margin-bottom: 8px; }
    p { color: #536079; }
    textarea { box-sizing: border-box; width: 100%; min-height: 120px; padding: 14px;
      border: 1px solid #c7cede; border-radius: 10px; font: inherit; resize: vertical; }
    button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px;
      background: #3157d5; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    section { margin-top: 24px; padding: 20px; background: white; border-radius: 10px;
      box-shadow: 0 2px 12px #17203312; }
    #answer { min-height: 80px; white-space: pre-wrap; line-height: 1.55; }
    #status { margin-top: 12px; font-size: .9rem; }
    .error { color: #b42318; }
    .stats { color: #536079; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Nimbus</h1>
    <p>Ask a question about the course notes.</p>
    <form id="ask-form">
      <textarea id="question" required placeholder="What is overfitting?"></textarea>
      <button id="submit" type="submit">Ask Nimbus</button>
    </form>
    <section>
      <div id="answer" aria-live="polite">Your answer will appear here.</div>
      <div id="status"></div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#ask-form');
    const question = document.querySelector('#question');
    const answer = document.querySelector('#answer');
    const status = document.querySelector('#status');
    const submit = document.querySelector('#submit');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      answer.textContent = '';
      status.className = '';
      status.textContent = 'Thinking…';
      try {
        const response = await fetch('/ask', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question: question.value})
        });
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let stats = null;
        while (true) {
          const {value, done} = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
          const events = buffer.split('\n\n');
          buffer = events.pop();
          for (const eventText of events) {
            const line = eventText.split('\n').find(line => line.startsWith('data: '));
            if (!line || line === 'data: [DONE]') continue;
            const payload = JSON.parse(line.slice(6));
            if (payload.delta) answer.textContent += payload.delta;
            if (payload.stats) stats = payload.stats;
          }
          if (done) break;
        }
        status.textContent = stats
          ? `Finished in ${stats.compute_ms.toFixed(0)} ms · ${stats.tokens_out} output tokens`
          : 'Finished';
        if (stats && stats.usage_source === 'unreported') {
          status.textContent += ' · provider usage not reported';
        }
      } catch (error) {
        answer.textContent = '';
        status.className = 'error';
        status.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
